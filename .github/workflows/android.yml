name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Pruebas de dominio y criptografía
        run: ./gradlew :domain:test :crypto:test --stacktrace

      - name: Validar capturas de pantalla
        run: ./gradlew :app:validateDebugScreenshotTest --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: gymtracker-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Subir informes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-${{ github.sha }}
          path: |
            **/build/reports/
            app/build/outputs/screenshotTest-results/
          retention-days: 7
